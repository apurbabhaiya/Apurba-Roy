name: Supabase Migration CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - migrate/firebase-to-supabase

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Supabase auth smoke test
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = 'https://izfmwvqveiphyuufvxoq.supabase.co';
          const key = 'sb_publishable_pTtO1vQIUiYpwVUHWYbCeA_hug5Y7Hn';
          const supabase = createClient(url, key, {
            auth: {
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false,
            },
          });

          const { data: anon, error: anonError } = await supabase.auth.signInAnonymously();
          if (anonError || !anon?.user?.is_anonymous) {
            throw new Error(`Anonymous auth failed: ${anonError?.message || 'anonymous user not returned'}`);
          }
          await supabase.auth.signOut();

          const { data: oauth, error: oauthError } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              skipBrowserRedirect: true,
              redirectTo: 'https://apurba-roy-three.vercel.app',
              scopes: 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file',
              queryParams: {
                access_type: 'offline',
                prompt: 'consent',
              },
            },
          });

          if (oauthError || !oauth?.url) {
            throw new Error(`Google OAuth setup failed: ${oauthError?.message || 'OAuth URL not returned'}`);
          }

          const response = await fetch(oauth.url, {
            redirect: 'manual',
            headers: { apikey: key },
          });
          const location = response.headers.get('location') || '';

          if (![301, 302, 303, 307, 308].includes(response.status) || !location.includes('accounts.google.com')) {
            const body = await response.text().catch(() => '');
            throw new Error(`Google provider is not ready. HTTP ${response.status}. ${body.slice(0, 300)}`);
          }

          console.log('Supabase anonymous auth and Google OAuth provider are ready.');
          NODE

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
