name: Firebase Data Inventory

on:
  push:
    branches:
      - migrate/firebase-to-supabase
    paths:
      - .github/workflows/firebase-inventory.yml
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Firebase collections
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const apiKey = 'AIzaSyDkBB-_a5J9f-IeDhXaWg50h39D0rNqo2Q';
          const projectId = 'aaaaaaaaaaa8-a7a63';

          const signUp = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: '{}',
          });

          if (!signUp.ok) {
            throw new Error(`Firebase anonymous auth failed: ${signUp.status} ${await signUp.text()}`);
          }

          const auth = await signUp.json();
          const token = auth.idToken;
          const base = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents`;

          async function listDocs(path) {
            let pageToken = '';
            let count = 0;
            do {
              const url = new URL(`${base}/${path}`);
              url.searchParams.set('pageSize', '300');
              if (pageToken) url.searchParams.set('pageToken', pageToken);

              const res = await fetch(url, {
                headers: { authorization: `Bearer ${token}` },
              });

              if (res.status === 404) return { count: 0, docs: [] };
              if (!res.ok) {
                throw new Error(`Firestore list failed for ${path}: ${res.status} ${await res.text()}`);
              }

              const body = await res.json();
              const docs = body.documents || [];
              count += docs.length;
              pageToken = body.nextPageToken || '';
            } while (pageToken);

            return { count };
          }

          const projects = await listDocs('projects');
          const customerGalleries = await listDocs('customerGalleries');
          const clientGallerySessions = await listDocs('clientGallerySessions');

          console.log('FIREBASE_INVENTORY=' + JSON.stringify({
            projects: projects.count,
            customerGalleries: customerGalleries.count,
            clientGallerySessions: clientGallerySessions.count,
          }));
          NODE
