name: Firebase Data Inventory

on:
  push:
    branches:
      - migrate/firebase-to-supabase
    paths:
      - .github/workflows/firebase-inventory.yml
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Firebase data sources
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          function readConfig(ref) {
            const raw = execFileSync('git', ['show', `${ref}:firebase-applet-config.json`], { encoding: 'utf8' });
            return JSON.parse(raw);
          }

          async function authStatus(cfg) {
            const res = await fetch(
              `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${cfg.apiKey}`,
              {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: '{}',
              }
            );

            if (res.ok) return { ok: true, code: 'ok' };

            let code = `http_${res.status}`;
            try {
              const body = await res.json();
              code = body?.error?.message || code;
            } catch {}
            return { ok: false, code };
          }

          async function countPublicGalleryDocs(cfg) {
            const base =
              `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/customerGalleries`;

            let pageToken = '';
            let count = 0;

            do {
              const url = new URL(base);
              url.searchParams.set('pageSize', '300');
              if (pageToken) url.searchParams.set('pageToken', pageToken);

              const res = await fetch(url);
              if (res.status === 404) return { ok: true, count: 0, code: 'not_found' };

              if (!res.ok) {
                const body = await res.text();
                return {
                  ok: false,
                  count: null,
                  code: body.includes('SERVICE_DISABLED')
                    ? 'SERVICE_DISABLED'
                    : body.includes('PERMISSION_DENIED')
                    ? 'PERMISSION_DENIED'
                    : `HTTP_${res.status}`,
                };
              }

              const body = await res.json();
              count += (body.documents || []).length;
              pageToken = body.nextPageToken || '';
            } while (pageToken);

            return { ok: true, count, code: 'ok' };
          }

          const sources = [
            { label: 'current-main', ref: 'origin/main' },
            { label: 'previous-working', ref: 'f36878bded58b9e114f05f2a467e76ab9147b1e7' },
          ];

          const results = [];

          for (const source of sources) {
            const cfg = readConfig(source.ref);
            const auth = await authStatus(cfg);
            const publicGalleries = await countPublicGalleryDocs(cfg);

            results.push({
              label: source.label,
              projectId: cfg.projectId,
              anonymousAuth: auth.code,
              publicCustomerGalleries: publicGalleries,
            });
          }

          console.log('FIREBASE_SOURCE_CHECK=' + JSON.stringify(results));
          NODE
