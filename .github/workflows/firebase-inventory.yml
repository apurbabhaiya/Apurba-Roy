name: Firebase Data Inventory

on:
  push:
    branches:
      - migrate/firebase-to-supabase
    paths:
      - .github/workflows/firebase-inventory.yml
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect current and previous Firebase projects
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          function readConfig(ref) {
            const raw = execFileSync('git', ['show', `${ref}:firebase-applet-config.json`], { encoding: 'utf8' });
            return JSON.parse(raw);
          }

          const sources = [
            { label: 'current-main', ref: 'origin/main' },
            { label: 'previous-working', ref: 'f36878bded58b9e114f05f2a467e76ab9147b1e7' },
          ];

          async function inspect(source) {
            const cfg = readConfig(source.ref);
            const result = {
              label: source.label,
              projectId: cfg.projectId,
              auth: 'unknown',
              firestore: 'unknown',
              projects: null,
              customerGalleries: null,
              clientGallerySessions: null,
            };

            const signUp = await fetch(
              `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${cfg.apiKey}`,
              {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: '{}',
              }
            );

            if (!signUp.ok) {
              result.auth = `failed:${signUp.status}`;
              return result;
            }

            const auth = await signUp.json();
            const token = auth.idToken;
            result.auth = 'ok';

            const base =
              `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents`;

            async function countDocs(path) {
              let pageToken = '';
              let count = 0;

              do {
                const url = new URL(`${base}/${path}`);
                url.searchParams.set('pageSize', '300');
                if (pageToken) url.searchParams.set('pageToken', pageToken);

                const res = await fetch(url, {
                  headers: { authorization: `Bearer ${token}` },
                });

                if (res.status === 404) return 0;

                if (!res.ok) {
                  const body = await res.text();
                  throw new Error(
                    `${res.status}:${body.includes('SERVICE_DISABLED') ? 'SERVICE_DISABLED' : 'LIST_FAILED'}`
                  );
                }

                const body = await res.json();
                count += (body.documents || []).length;
                pageToken = body.nextPageToken || '';
              } while (pageToken);

              return count;
            }

            try {
              result.projects = await countDocs('projects');
              result.customerGalleries = await countDocs('customerGalleries');
              result.clientGallerySessions = await countDocs('clientGallerySessions');
              result.firestore = 'ok';
            } catch (error) {
              result.firestore = error?.message || String(error);
            }

            return result;
          }

          const inventory = [];
          for (const source of sources) {
            inventory.push(await inspect(source));
          }

          console.log('FIREBASE_INVENTORY=' + JSON.stringify(inventory));
          NODE
