name: Firebase Data Inventory

on:
  push:
    branches:
      - migrate/firebase-to-supabase
    paths:
      - .github/workflows/firebase-inventory.yml
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Firebase data sources
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          function readConfig(ref) {
            const raw = execFileSync('git', ['show', `${ref}:firebase-applet-config.json`], { encoding: 'utf8' });
            return JSON.parse(raw);
          }

          async function anonymousToken(cfg) {
            const res = await fetch(
              `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${cfg.apiKey}`,
              {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: '{}',
              }
            );

            if (!res.ok) {
              let code = `http_${res.status}`;
              try {
                const body = await res.json();
                code = body?.error?.message || code;
              } catch {}
              return { token: null, code };
            }

            const body = await res.json();
            return { token: body.idToken, code: 'ok' };
          }

          async function countDocs(cfg, collection, token) {
            const base =
              `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/${collection}`;

            let pageToken = '';
            let count = 0;

            do {
              const url = new URL(base);
              url.searchParams.set('pageSize', '300');
              if (pageToken) url.searchParams.set('pageToken', pageToken);

              const headers = token ? { authorization: `Bearer ${token}` } : {};
              const res = await fetch(url, { headers });

              if (res.status === 404) return { ok: true, count: 0, code: 'not_found' };

              if (!res.ok) {
                const body = await res.text();
                return {
                  ok: false,
                  count: null,
                  code: body.includes('SERVICE_DISABLED')
                    ? 'SERVICE_DISABLED'
                    : body.includes('PERMISSION_DENIED')
                    ? 'PERMISSION_DENIED'
                    : `HTTP_${res.status}`,
                };
              }

              const body = await res.json();
              count += (body.documents || []).length;
              pageToken = body.nextPageToken || '';
            } while (pageToken);

            return { ok: true, count, code: 'ok' };
          }

          const sources = [
            { label: 'current-main', ref: 'origin/main' },
            { label: 'middle-config', ref: '4b157fd2cb811f0cc952cf2bd891f077a5f3fa67' },
            { label: 'previous-working', ref: '73ee19bda1db6ad643078d055ff3da4559012b79' },
          ];

          const results = [];

          for (const source of sources) {
            const cfg = readConfig(source.ref);
            const auth = await anonymousToken(cfg);

            const projects = auth.token
              ? await countDocs(cfg, 'projects', auth.token)
              : { ok: false, count: null, code: 'NO_TOKEN' };

            const customerGalleries = auth.token
              ? await countDocs(cfg, 'customerGalleries', auth.token)
              : await countDocs(cfg, 'customerGalleries', null);

            const clientGallerySessions = auth.token
              ? await countDocs(cfg, 'clientGallerySessions', auth.token)
              : { ok: false, count: null, code: 'NO_TOKEN' };

            results.push({
              label: source.label,
              projectId: cfg.projectId,
              anonymousAuth: auth.code,
              projects,
              customerGalleries,
              clientGallerySessions,
            });
          }

          console.log('FIREBASE_AUTH_INVENTORY=' + JSON.stringify(results));
          NODE
